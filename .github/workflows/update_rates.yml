name: Auto Update Market Rates

on:
  schedule:
    - cron: '0 * * * *' # يعمل أوتوماتيكياً كل ساعة تماماً
  workflow_dispatch: # يتيح لك زر لتشغيله يدوياً متى شئت من جيت هوب

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Automated Scraper
        run: python update_rates.py

      - name: Commit and push updated rates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add rates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update rates.json [skip ci]" && git push)
